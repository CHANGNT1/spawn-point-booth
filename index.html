<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Point | Booth Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-cyan-500 selection:text-slate-950">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <!-- Logo with Hover Animation -->
                <div class="h-12 w-14 rounded-xl bg-white/95 p-1.5 flex items-center justify-center shadow-lg shadow-cyan-500/20 border border-cyan-400/30 shrink-0 transition-all duration-300 hover:scale-110 hover:shadow-cyan-500/40 hover:border-cyan-400 cursor-pointer">
                    <img src="/logo.png" alt="Spawn Point Logo" class="max-h-full max-w-full object-contain">
                </div>
                <div>
                    <h1 class="font-black text-xl sm:text-2xl tracking-tight text-white flex items-center gap-2">
                        SPAWN POINT <span class="text-xs px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-semibold">BOOTH DB</span>
                    </h1>
                    <p class="text-xs text-slate-400">Competition Management</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2.5">
                <button id="exportBtn" onclick="exportCSV()" class="hidden items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                    Export CSV
                </button>

                <!-- Dynamic Admin / Exit Controls -->
                <div id="adminControlsContainer" class="flex items-center gap-2">
                    <button id="adminActionBtn" onclick="handleAdminButton()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-sm transition">
                        <svg id="lockIcon" class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <span id="adminBtnText">Admin Login</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
        
        <!-- Category Filter Tabs (Centered with Hover Effects) -->
        <div class="flex flex-wrap justify-center gap-2 sm:gap-3">
            <button onclick="setCategory('FIFA: Fastest Goal')" class="category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20" data-category="FIFA: Fastest Goal">
                ⚽ FIFA: Fastest Goal
            </button>
            <button onclick="setCategory('FIFA: Most Goals (6 Mins)')" class="category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-200" data-category="FIFA: Most Goals (6 Mins)">
                ⚡ FIFA: Most Goals (6 Mins)
            </button>
            <button onclick="setCategory('Rocket League: Fastest Goal')" class="category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-200" data-category="Rocket League: Fastest Goal">
                🚗 RL: Fastest Goal
            </button>
            <button onclick="setCategory('Rocket League: Most Goals (5 Mins)')" class="category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-200" data-category="Rocket League: Most Goals (5 Mins)">
                🔥 RL: Most Goals (5 Mins)
            </button>
        </div>

        <!-- Podium Leaders -->
        <div id="podiumLeaders" class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end min-h-[180px]">
            <!-- Populated via JavaScript -->
        </div>

        <!-- Leaderboard Table Section -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl backdrop-blur-sm overflow-hidden shadow-xl">
            <div class="p-6 border-b border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 id="currentCategoryTitle" class="text-lg font-bold text-white text-center sm:text-left">FIFA: Fastest Goal Leaderboard</h2>
                </div>
                <div class="flex items-center justify-center gap-3">
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search player..." class="px-3.5 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
                    <span id="playerCountBadge" class="px-3 py-1.5 rounded-full bg-slate-800 text-cyan-400 text-xs font-bold border border-slate-700 whitespace-nowrap">0 Players</span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-900/80">
                            <th class="py-3.5 px-6 text-center">Rank</th>
                            <th class="py-3.5 px-6 text-center">Player Name</th>
                            <th class="py-3.5 px-6 text-center" id="metricHeader">Time (Seconds)</th>
                            <th class="py-3.5 px-6 text-center admin-only hidden">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardTableBody" class="divide-y divide-slate-800/50 text-sm">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Admin PIN Login Modal -->
    <div id="pinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Crew Admin Access</h3>
                <button onclick="closePinModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            <p class="text-xs text-slate-400">Enter your 4-digit crew PIN to unlock score recording, editing, and deletion.</p>
            <form onsubmit="verifyPin(event)" class="space-y-4">
                <input type="password" id="pinInput" maxlength="6" required placeholder="Enter PIN" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center text-lg tracking-widest font-bold text-white focus:outline-none focus:border-cyan-500">
                <p id="pinError" class="text-xs text-rose-400 hidden text-center font-semibold">Incorrect PIN. Access denied.</p>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 transition">
                    Unlock Admin Controls
                </button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Score Modal -->
    <div id="scoreModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Record New Score</h3>
                <button onclick="closeScoreModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            
            <form id="scoreForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editScoreId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Player Name</label>
                    <input type="text" id="playerNameInput" required placeholder="e.g. Alex" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Game Category</label>
                    <select id="gameCategoryInput" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500">
                        <option value="FIFA: Fastest Goal">FIFA: Fastest Goal</option>
                        <option value="FIFA: Most Goals (6 Mins)">FIFA: Most Goals (6 Mins)</option>
                        <option value="Rocket League: Fastest Goal">Rocket League: Fastest Goal</option>
                        <option value="Rocket League: Most Goals (5 Mins)">Rocket League: Most Goals (5 Mins)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Value (Seconds or Goals)</label>
                    <input type="number" step="any" id="scoreValueInput" required placeholder="e.g. 12.4 or 5" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeScoreModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-sm hover:bg-slate-700 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 transition">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "/api/scores";
        const CREW_PIN = "2026"; 

        let scores = [];
        let currentCategory = 'FIFA: Fastest Goal';
        
        // isAdmin is now a standard variable, so refreshing the page auto-logs out back to public view!
        let isAdmin = false;

        function syncAdminUI() {
            const btn = document.getElementById('adminActionBtn');
            const btnText = document.getElementById('adminBtnText');
            const exportBtn = document.getElementById('exportBtn');
            const container = document.getElementById('adminControlsContainer');

            if (isAdmin) {
                btn.className = "inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 transition";
                btnText.innerText = "+ Record Entry";
                document.getElementById('lockIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>`;
                exportBtn.classList.remove('hidden');
                exportBtn.classList.add('inline-flex');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));

                // Add Exit Admin button if it doesn't already exist
                if (!document.getElementById('exitAdminBtn')) {
                    const exitBtn = document.createElement('button');
                    exitBtn.id = 'exitAdminBtn';
                    exitBtn.onclick = logoutAdmin;
                    exitBtn.className = "px-3.5 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-bold border border-rose-500/30 transition";
                    exitBtn.innerText = "Exit Admin";
                    container.appendChild(exitBtn);
                }
            } else {
                btn.className = "inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-sm transition";
                btnText.innerText = "Admin Login";
                document.getElementById('lockIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>`;
                exportBtn.classList.remove('inline-flex');
                exportBtn.classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));

                const exitBtn = document.getElementById('exitAdminBtn');
                if (exitBtn) exitBtn.remove();
            }
        }

        function handleAdminButton() {
            if (!isAdmin) {
                document.getElementById('pinError').classList.add('hidden');
                document.getElementById('pinInput').value = '';
                document.getElementById('pinModal').classList.remove('hidden');
                document.getElementById('pinInput').focus();
            } else {
                openAddModal();
            }
        }

        function closePinModal() {
            document.getElementById('pinModal').classList.add('hidden');
        }

        function verifyPin(event) {
            event.preventDefault();
            const entered = document.getElementById('pinInput').value;
            if (entered === CREW_PIN) {
                isAdmin = true;
                closePinModal();
                syncAdminUI();
                renderApp();
            } else {
                document.getElementById('pinError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            syncAdminUI();
            renderApp();
        }

        async function fetchScores() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                scores = data.map(item => ({
                    id: item.id,
                    name: item.name,
                    game: item.game,
                    score: parseFloat(item.score)
                }));
                renderApp();
            } catch (error) {
                console.error("Error fetching scores:", error);
            }
        }

        function setCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.className = "category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20";
                } else {
                    btn.className = "category-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 hover:scale-105 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-200";
                }
            });
            document.getElementById('currentCategoryTitle').innerText = category + " Leaderboard";
            renderApp();
        }

        function renderApp() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const isFastest = currentCategory.includes('Fastest Goal');

            let categoryScores = scores.filter(s => s.game === currentCategory);
            if (isFastest) {
                categoryScores.sort((a, b) => a.score - b.score);
            } else {
                categoryScores.sort((a, b) => b.score - a.score);
            }

            // Podium Rendering (Balanced Order: 2nd, 1st, 3rd)
            const podiumDiv = document.getElementById('podiumLeaders');
            podiumDiv.innerHTML = "";

            if (categoryScores.length === 1) {
                podiumDiv.className = "grid grid-cols-1 md:grid-cols-3 gap-6 items-end min-h-[180px]";
                podiumDiv.innerHTML = `<div></div>`;
                renderPodiumCard(categoryScores[0], '1st Place', '🥇', 'border-amber-500/40 bg-amber-500/5');
                podiumDiv.innerHTML += `<div></div>`;
            } else {
                podiumDiv.className = "grid grid-cols-1 md:grid-cols-3 gap-6 items-end min-h-[180px]";
                
                let orderedPodium = [];
                if (categoryScores.length >= 2) orderedPodium.push({ item: categoryScores[1], rank: '2nd Place', medal: '🥈', border: 'border-slate-400/30 bg-slate-800/30' });
                else orderedPodium.push(null);

                if (categoryScores.length >= 1) orderedPodium.push({ item: categoryScores[0], rank: '1st Place', medal: '🥇', border: 'border-amber-500/40 bg-amber-500/5' });
                
                if (categoryScores.length >= 3) orderedPodium.push({ item: categoryScores[2], rank: '3rd Place', medal: '🥉', border: 'border-orange-500/30 bg-orange-500/5' });

                orderedPodium.forEach(slot => {
                    if (slot) {
                        renderPodiumCard(slot.item, slot.rank, slot.medal, slot.border);
                    } else {
                        podiumDiv.innerHTML += `<div></div>`;
                    }
                });
            }

            let filtered = categoryScores.filter(s => s.name.toLowerCase().includes(searchTerm));
            document.getElementById('metricHeader').innerText = isFastest ? "Time (Seconds)" : "Goals Scored";
            document.getElementById('playerCountBadge').innerText = `${categoryScores.length} Players`;

            const tbody = document.getElementById('leaderboardTableBody');
            tbody.innerHTML = "";

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 4 : 3}" class="py-12 text-center text-slate-500">No entries recorded for this category yet.</td></tr>`;
                return;
            }

            filtered.forEach((item) => {
                const trueRank = categoryScores.findIndex(s => s.id === item.id) + 1;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-900/50 transition";
                tr.innerHTML = `
                    <td class="py-4 px-6 font-bold text-slate-300 text-center">#${trueRank}</td>
                    <td class="py-4 px-6 font-semibold text-white text-center">${escapeHtml(item.name)}</td>
                    <td class="py-4 px-6 font-extrabold text-cyan-400 text-center">${item.score} ${isFastest ? 's' : 'Goals'}</td>
                    <td class="py-4 px-6 text-center admin-only ${isAdmin ? '' : 'hidden'}">
                        <button onclick="openEditModal(${item.id})" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-semibold mr-2 transition">Edit</button>
                        <button onclick="deleteScore(${item.id})" class="px-3 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-semibold transition">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPodiumCard(item, rankLabel, medal, extraBorder) {
            const isFastest = currentCategory.includes('Fastest Goal');
            const podiumDiv = document.getElementById('podiumLeaders');
            const card = document.createElement('div');
            card.className = `relative bg-slate-900/80 border ${extraBorder} rounded-2xl p-6 flex flex-col items-center text-center shadow-lg transition-all duration-300 hover:scale-105 hover:border-cyan-500/50`;
            
            card.innerHTML = `
                <div class="absolute top-4 right-4 text-2xl">${medal}</div>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">${rankLabel}</span>
                <div class="h-14 w-14 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center mb-3 font-black text-xl text-cyan-400">
                    ${escapeHtml(item.name.charAt(0).toUpperCase())}
                </div>
                <h3 class="font-extrabold text-lg text-white mb-1 truncate w-full">${escapeHtml(item.name)}</h3>
                <p class="text-xs text-slate-400 mb-4">${escapeHtml(item.game)}</p>
                <div class="px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30">
                    <span class="font-black text-2xl text-cyan-400">${item.score}</span>
                    <span class="text-xs text-cyan-400 font-bold ml-1">${isFastest ? 'sec' : 'goals'}</span>
                </div>
            `;
            podiumDiv.appendChild(card);
        }

        function openAddModal() {
            if (!isAdmin) return;
            document.getElementById('modalTitle').innerText = "Record New Score";
            document.getElementById('editScoreId').value = "";
            document.getElementById('playerNameInput').value = "";
            document.getElementById('gameCategoryInput').value = currentCategory;
            document.getElementById('scoreValueInput').value = "";
            document.getElementById('scoreModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            if (!isAdmin) return;
            const item = scores.find(s => s.id === id);
            if (!item) return;
            document.getElementById('modalTitle').innerText = "Edit Score Entry";
            document.getElementById('editScoreId').value = item.id;
            document.getElementById('playerNameInput').value = item.name;
            document.getElementById('gameCategoryInput').value = item.game;
            document.getElementById('scoreValueInput').value = item.score;
            document.getElementById('scoreModal').classList.remove('hidden');
        }

        function closeScoreModal() {
            document.getElementById('scoreModal').classList.add('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('editScoreId').value;
            const name = document.getElementById('playerNameInput').value;
            const game = document.getElementById('gameCategoryInput').value;
            const score = document.getElementById('scoreValueInput').value;
            const payload = { name, game, score };

            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                closeScoreModal();
                fetchScores();
            } catch (error) {
                console.error("Error saving score:", error);
            }
        }

        async function deleteScore(id) {
            if (!isAdmin) return;
            if (confirm("Are you sure you want to delete this score entry?")) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    fetchScores();
                } catch (error) {
                    console.error("Error deleting score:", error);
                }
            }
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,ID,Player Name,Game Category,Score\n";
            scores.forEach(row => {
                csvContent += `${row.id},"${row.name}","${row.game}",${row.score}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "spawn_point_leaderboard.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        syncAdminUI();
        fetchScores();
    </script>
</body>
</html>
